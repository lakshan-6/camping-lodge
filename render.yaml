services:
  - type: web
    name: camping-lodge
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: SETUP_KEY
        generateValue: true
      - key: PAST_ORDER_DELETE_KEY
        generateValue: true
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
